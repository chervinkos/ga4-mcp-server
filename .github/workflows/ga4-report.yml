name: GA4 report

# Fills the "2026" / "2026 weekly" tabs of the GA4 Reporting Template sheet.
# No LLM involved: reporting/ga4_report.py calls the Google APIs directly with
# the service-account key stored in the GA4_SA_KEY_JSON repository secret.
#
# 10:00 Europe/Kyiv is 07:00 UTC in summer (EEST) and 08:00 UTC in winter (EET).
# Both UTC times are scheduled and the "decide" step lets only the one that is
# 10:xx in Kyiv through. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "0 7,8 * * 1"    # every Monday: weekly + monthly
    - cron: "0 7,8 1 * *"    # 1st of the month: monthly (closes last month)
  workflow_dispatch:
    inputs:
      args:
        description: "weekly|monthly, range, preview, overwrite, refresh[=N] (empty = everything)"
        required: false
        default: "preview"

concurrency:
  group: ga4-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_ARGS: ${{ github.event.inputs.args }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "args=$INPUT_ARGS" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Europe/Kyiv date +%H)
            if [ "$hour" = "10" ]; then run=yes; else run=no; fi
            echo "run=$run" >> "$GITHUB_OUTPUT"
            if [ "$SCHEDULE" = "0 7,8 1 * *" ]; then
              echo "args=monthly" >> "$GITHUB_OUTPUT"
            else
              echo "args=" >> "$GITHUB_OUTPUT"
            fi
            echo "Kyiv hour is $hour -> run=$run"
          fi

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reporting/requirements.txt

      - name: Install dependencies
        if: steps.decide.outputs.run == 'yes'
        run: pip install -r reporting/requirements.txt

      - name: Run tests
        if: steps.decide.outputs.run == 'yes'
        run: python -m unittest discover -s reporting

      - name: Fill the sheet
        if: steps.decide.outputs.run == 'yes'
        env:
          GA4_SA_KEY_JSON: ${{ secrets.GA4_SA_KEY_JSON }}
          REPORT_ARGS: ${{ steps.decide.outputs.args }}
        run: |
          set -o pipefail -f
          python reporting/ga4_report.py $REPORT_ARGS | tee -a "$GITHUB_STEP_SUMMARY"
